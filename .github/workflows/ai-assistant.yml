name: AI Assistant Workflow
on:
  issues:
    types: [opened, commented]
  pull_request:
    types: [opened, review_requested]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run AI Agent
        uses: neurolink-ai/neurolink-action@v1
        with:
          provider: "anthropic"
          model: "claude-3-5-sonnet-20241022"
          prompt: "قم بمراجعة هذا الطلب وقدم ملخصاً"
